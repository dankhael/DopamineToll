<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Without this, Firefox for Android lays the popup out in its default 980px
       desktop viewport and the 300px body renders as a tiny column in the corner. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="appName">Dopamine Toll</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="top">
      <div class="name"><span class="mark"></span><span data-i18n="appName">Dopamine Toll</span></div>
      <div class="toggle" id="toggle" role="switch" tabindex="0" data-i18n-label="popupEnableAria" aria-label="Enable Dopamine Toll"></div>
    </div>

    <div class="rows">
      <div class="row"><span class="l" data-i18n="popupTollList">toll list</span><span class="r amber" id="count">…</span></div>
      <div class="row" id="freepass-row" hidden><span class="l" data-i18n="popupFreePasses">free passes</span><span class="r amber" id="freepass-count">…</span></div>
      <div class="row status" id="status">
        <div class="head2"><span class="dot"></span><span id="status-host" data-i18n="popupChecking">checking tab…</span></div>
        <div class="meta" id="status-meta"></div>
      </div>
      <div class="row stat"><span class="l" id="stat"></span></div>
    </div>

    <div class="turnoff" id="turnoff" hidden>
      <button class="turnoff-btn" id="turnoff-cancel"></button>
      <span class="turnoff-note" data-i18n="popupTurnOffNote">close this window and the count starts over</span>
    </div>

    <button class="grantbtn" id="grant-access" data-i18n="popupGrantAccess" hidden>Grant site access</button>
    <button class="openbtn" id="open-options" data-i18n="popupOpenSettings">Open settings</button>
  </div>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/platform.js"></script>
  <script src="../shared/freepass.js"></script>
  <script src="../shared/countdown.js"></script>
  <script src="../shared/tollguard.js"></script>
  <script src="popup.js"></script>
</body>
</html>
